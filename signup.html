<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MD Tausif Tools</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">

            <h1>Create Account</h1>
            <p class="subtitle">Sign up to get started</p>

            <form id="signupForm">

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
                </div>

                <button type="submit" class="auth-button" id="signupButton">Sign Up</button>

            </form>

            <p class="switch-page">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <p id="authMessage" class="auth-message"></p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
    document.documentElement.classList.add("auth-pending");
</script>

<style>
    html.auth-pending body {
        visibility: hidden;
    }
</style>

<title>PDF Compressor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    background: #f4f4f9;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
}

.main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 520px);
    min-height: 100vh;
    width: 100%;
}

.preview-section {
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
}

.upload-area {
    width: 280px;
    max-width: 100%;
    min-height: 300px;
    background: white;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.upload-icon {
    font-size: 55px;
    color: #ed302b;
    margin-bottom: 15px;
}

.upload-btn {
    display: inline-block;
    background: #ed302b;
    color: white;
    padding: 13px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
}

#pdfInput {
    display: none;
}

#pdfPreview {
    width: 100%;
    height: 260px;
    border: none;
    margin-top: 15px;
    display: none;
}

#fileInfo {
    margin-top: 12px;
    font-size: 13px;
    color: #555;
    word-break: break-word;
    overflow-wrap: anywhere;
}

.settings {
    background: white;
    border-left: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.heading {
    text-align: center;
    padding: 25px;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
}

.options {
    padding: 30px;
}

.option {
    border: 1px solid #d5d5df;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: .2s;
    min-width: 0;
}

.option:hover {
    border-color: #ed302b;
}

.option:has(input:checked) {
    border: 1px solid #555;
    background: #fffafa;
}

.option input {
    width: 22px;
    height: 22px;
    accent-color: #333;
    cursor: pointer;
    flex-shrink: 0;
}

.option strong {
    font-size: 17px;
    color: #333;
}

.option p {
    color: #555;
    margin-top: 7px;
    font-size: 15px;
    line-height: 1.5;
}

.target-box {
    padding: 0 30px 25px;
}

.target-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 17px;
}

.target-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
    outline: none;
}

.target-box input:focus {
    border-color: #ed302b;
}

.bottom {
    margin-top: auto;
    padding: 30px;
    background: #fff5f5;
}

#compressBtn {
    width: 100%;
    padding: 25px;
    border: none;
    border-radius: 14px;
    background: #ed302b;
    color: white;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
}

#compressBtn:hover {
    background: #d92320;
}

#compressBtn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* PROGRESS BAR */

#progressContainer {
    display: none;
    margin-top: 20px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
}

#progressPercent {
    color: #ed8500;
    font-size: 16px;
}

.progress-track {
    width: 100%;
    height: 10px;
    background: #e5e5e5;
    border-radius: 20px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #ff8c00;
    border-radius: 20px;
    transition: width .3s ease;
}

#progressStatus {
    margin-top: 9px;
    font-size: 13px;
    color: #666;
    overflow-wrap: anywhere;
}

#result {
    margin-top: 20px;
    text-align: center;
    line-height: 1.8;
    color: #333;
    font-size: 15px;
    word-break: break-word;
}

/* TABLET */

@media(max-width: 900px) {

    .main {
        grid-template-columns: 1fr;
        min-height: 100vh;
    }

    .preview-section {
        min-height: 350px;
        padding: 30px 20px;
    }

    .settings {
        border-left: none;
        border-top: 1px solid #ddd;
    }

    .options {
        max-width: 650px;
        width: 100%;
        margin: auto;
    }

    .target-box,
    .bottom {
        max-width: 650px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
    }
}

/* MOBILE */

@media(max-width: 600px) {

    .preview-section {
        min-height: auto;
        padding: 25px 15px;
    }

    .upload-area {
        width: 100%;
        max-width: 340px;
        min-height: 260px;
        padding: 20px 15px;
    }

    #pdfPreview {
        height: 220px;
    }

    .upload-icon {
        font-size: 45px;
    }

    .heading {
        font-size: 22px;
        padding: 20px 15px;
    }

    .options {
        padding: 20px 15px;
    }

    .option {
        padding: 17px 14px;
        gap: 11px;
        margin-bottom: 14px;
    }

    .option strong {
        font-size: 15px;
        line-height: 1.4;
    }

    .option p {
        font-size: 13px;
    }

    .option input {
        width: 20px;
        height: 20px;
        margin-top: 1px;
    }

    .target-box {
        padding: 0 15px 20px;
    }

    .target-box label {
        font-size: 15px;
    }

    .target-box input {
        padding: 13px;
        font-size: 16px;
    }

    .bottom {
        padding: 20px 15px;
    }

    #compressBtn {
        padding: 19px 12px;
        font-size: 19px;
        border-radius: 11px;
    }

    .progress-info {
        font-size: 12px;
    }

    #progressPercent {
        font-size: 14px;
    }

    #progressStatus {
        font-size: 12px;
    }

    #result {
        font-size: 13px;
    }
}

/* SMALL MOBILE */

@media(max-width: 360px) {

    .heading {
        font-size: 20px;
    }

    .option {
        padding: 14px 11px;
        gap: 9px;
    }

    .option strong {
        font-size: 14px;
    }

    .option p {
        font-size: 12px;
    }

    #compressBtn {
        font-size: 17px;
    }

}
</style>
</head>

<body>

<div class="main">

    <div class="preview-section">

        <div class="upload-area">

            <div class="upload-icon">📄</div>

            <h2>Select PDF</h2>

            <label for="pdfInput" class="upload-btn">
                Choose PDF
            </label>

            <input
                type="file"
                id="pdfInput"
                accept=".pdf,application/pdf"
            >

            <iframe id="pdfPreview"></iframe>

            <p id="fileInfo">No PDF selected</p>

        </div>

    </div>

    <div class="settings">

        <div class="heading">
            Compression level
        </div>

        <div class="options">

            <label class="option">
                <input
                    type="radio"
                    name="level"
                    value="extreme"
                >

                <div>
                    <strong>Extreme Compression</strong>
                    <p>Smaller file size, lower quality</p>
                </div>
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="level"
                    value="recommended"
                    checked
                >

                <div>
                    <strong>Recommended Compression</strong>
                    <p>Balanced file size and quality</p>
                </div>
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="level"
                    value="less"
                >

                <div>
                    <strong>Less Compression</strong>
                    <p>Higher quality, larger file size</p>
                </div>
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="level"
                    value="target"
                >

                <div>
                    <strong>Target Size (KB)</strong>
                    <p>Compress PDF to your desired size</p>
                </div>
            </label>

        </div>

        <div
            class="target-box"
            id="targetBox"
            style="display:none;"
        >

            <label>Enter Target PDF Size (KB)</label>

            <input
                type="number"
                id="targetSize"
                placeholder="Example: 100"
                min="1"
            >

        </div>

        <div class="bottom">

            <button
                id="compressBtn"
                onclick="compressPDF()"
            >
                Compress PDF ➜
            </button>

            <div id="progressContainer">

                <div class="progress-info">

                    <span>Compressing PDF</span>

                    <span id="progressPercent">0%</span>

                </div>

                <div class="progress-track">

                    <div id="progressBar"></div>

                </div>

                <p id="progressStatus">
                    Preparing PDF...
                </p>

            </div>

            <div id="result" aria-live="polite"></div>

        </div>

    </div>

</div>

<script>

// BACKEND URL

const API_BASE_URL = "https://md-tausif-backend.onrender.com";

let selectedPDF = null;
let previewURL = null;
let polling = false;


// SHOW TARGET INPUT

const radios = document.querySelectorAll(
    'input[name="level"]'
);

const targetBox = document.getElementById("targetBox");

function updateTargetBox() {

    const level = document.querySelector(
        'input[name="level"]:checked'
    ).value;

    targetBox.style.display =
        level === "target" ? "block" : "none";

}

radios.forEach(radio => {

    radio.addEventListener("change", updateTargetBox);

});

updateTargetBox();


// PDF SELECTION

document.getElementById("pdfInput")
.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    if (
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ) {

        alert("Please select a PDF file.");

        this.value = "";

        return;

    }

    selectedPDF = file;

    if (previewURL) {
        URL.revokeObjectURL(previewURL);
    }

    previewURL = URL.createObjectURL(file);

    const preview = document.getElementById("pdfPreview");

    preview.src = previewURL;

    preview.style.display = "block";

    document.getElementById("fileInfo").innerHTML =

        file.name +
        "<br><br>Original Size: " +
        (file.size / 1024).toFixed(2) +
        " KB";

    document.getElementById("result").innerHTML = "";

});


// UPDATE PROGRESS

function updateProgress(percent, message) {

    percent = Math.max(0, Math.min(100, Number(percent) || 0));

    document.getElementById("progressBar").style.width =
        percent + "%";

    document.getElementById("progressPercent").textContent =
        Math.floor(percent) + "%";

    if (message) {

        document.getElementById("progressStatus").textContent =
            message;

    }

}


// BACKEND PROGRESS POLLING WITH AUTHENTICATION

async function startProgressPolling(jobId, accessToken) {

    polling = true;

    let lastIndex = 0;

    while (polling) {

        try {

            const response = await fetch(
                API_BASE_URL + "/progress/" +
                encodeURIComponent(jobId),
                {
                    headers: {
                        "Authorization": `Bearer ${accessToken}`
                    }
                }
            );

            if (response.ok) {

                const data = await response.json();

                if (Array.isArray(data.updates)) {

                    const newUpdates =
                        data.updates.slice(lastIndex);

                    for (const update of newUpdates) {

                        updateProgress(
                            update.percent,
                            update.message
                        );

                        lastIndex++;

                        await new Promise(resolve =>
                            setTimeout(resolve, 120)
                        );

                    }

                }

                if (
                    data.status === "complete" ||
                    data.status === "error"
                ) {

                    polling = false;

                    break;

                }

            } else if (
                response.status === 401 ||
                response.status === 403
            ) {

                console.log("Progress authentication failed.");

                polling = false;

                break;

            }

        } catch (error) {

            console.log("Progress error:", error.message);

        }

        await new Promise(resolve =>
            setTimeout(resolve, 200)
        );

    }

}


// PDF COMPRESSION WITH AUTHENTICATION

async function compressPDF() {

    const file = selectedPDF;

    const targetInput = document.getElementById("targetSize");

    const target = targetInput.value.trim();

    const selectedLevel = document.querySelector(
        'input[name="level"]:checked'
    );

    const level = selectedLevel.value;

    const btn = document.getElementById("compressBtn");

    const result = document.getElementById("result");

    const progressContainer =
        document.getElementById("progressContainer");


    // CHECK PDF

    if (!file) {

        alert("Please select PDF first.");

        return;

    }


    // CHECK TARGET SIZE

    if (
        level === "target" &&
        (
            !target ||
            !Number.isFinite(Number(target)) ||
            Number(target) <= 0
        )
    ) {

        alert("Please enter a valid target size in KB.");

        targetInput.focus();

        return;

    }


    // PREPARE FORM DATA

    const formData = new FormData();

    formData.append("pdf", file);

    formData.append("compressionLevel", level);

    if (level === "target") {

        formData.append("targetSize", target);

    }


    const jobId =
        "job-" + Date.now() + "-" +
        Math.random().toString(36).substring(2, 10);


    btn.disabled = true;

    btn.innerHTML = "Compressing...";

    result.innerHTML = "";

    progressContainer.style.display = "block";

    updateProgress(1, "Checking login session...");

    polling = false;


    try {

        // GET SUPABASE LOGIN SESSION

        if (!window.supabaseClient) {

            throw new Error(
                "Authentication system not loaded. Please refresh the page."
            );

        }

        const {
            data: sessionData,
            error: sessionError
        } = await window.supabaseClient.auth.getSession();


        const accessToken =
            sessionData?.session?.access_token;


        // CHECK ACCESS TOKEN

        if (sessionError || !accessToken) {

            throw new Error(
                "Your login session has expired. Please login again."
            );

        }


        // SEND PDF TO BACKEND WITH JWT TOKEN

        updateProgress(2, "Uploading PDF...");

        const responsePromise = fetch(
            API_BASE_URL + "/compress",
            {
                method: "POST",

                headers: {
                    "X-Job-Id": jobId,
                    "Authorization": `Bearer ${accessToken}`
                },

                body: formData
            }
        );


        // START AUTHENTICATED PROGRESS POLLING

        startProgressPolling(jobId, accessToken);


        // WAIT FOR COMPRESSION RESPONSE

        const response = await responsePromise;


        if (!response.ok) {

            let message = "Compression failed";

            try {

                const error = await response.json();

                message = error.error || message;

            } catch (e) {}

            throw new Error(message);

        }


        // GET COMPRESSED PDF

        const blob = await response.blob();

        if (!blob.size) {

            throw new Error("Compressed PDF is empty.");

        }


        polling = false;

        updateProgress(
            100,
            "Compression completed successfully!"
        );


        // DOWNLOAD PDF

        const downloadURL = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = downloadURL;

        link.download = "compressed.pdf";

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(() => {

            URL.revokeObjectURL(downloadURL);

        }, 3000);


        // CALCULATE FILE SIZE

        const compressedSize =
            Number(response.headers.get("X-Output-Size-KB")) ||
            blob.size / 1024;

        const originalSize = file.size / 1024;

        const saved = (
            ((originalSize - compressedSize) /
            originalSize) * 100
        ).toFixed(2);


        // SHOW RESULT

        result.innerHTML =

            "<strong>PDF Compressed Successfully!</strong><br><br>" +

            "Selected Mode: " + level + "<br>" +

            "Original Size: " +
            originalSize.toFixed(2) + " KB<br>" +

            "Compressed Size: " +
            compressedSize.toFixed(2) + " KB<br>" +

            "Space Saved: " +
            saved + "%<br><br>" +

            "Your PDF has been downloaded.";

    }

    catch(error) {

        polling = false;

        updateProgress(0, "Compression failed.");

        result.textContent =
            "Error: " + error.message;

    }

    finally {

        polling = false;

        btn.disabled = false;

        btn.innerHTML = "Compress PDF ➜";

    }

}

</script>


<!-- SUPABASE AUTHENTICATION -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>

</body>
</html>

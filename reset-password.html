<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MD Tausif Tools</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">

            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password</p>

            <form id="resetPasswordForm">

                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
                </div>

                <div class="input-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required minlength="6">
                </div>

                <button type="submit" class="auth-button" id="resetButton">Update Password</button>

            </form>

            <p class="switch-page">
                Remember your password?
                <a href="login.html">Login</a>
            </p>

            <p id="authMessage" class="auth-message"></p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

</body>
</html>
